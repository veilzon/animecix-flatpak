name: Flatpak repo build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "AnimeciX tag (örn. v1.3.2); boşsa son release"
        required: false
        default: ""
      force:
        description: "Zaten yayındaysa da yeniden derle"
        type: boolean
        default: false
      source_ref:
        description: "Kaynak ref (boşsa tag; örn. main)"
        required: false
        default: ""
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: flatpak-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(curl -fsSL https://api.github.com/repos/veilzon/animecix-linux/releases/latest \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["tag_name"])')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          REF="${{ inputs.source_ref }}"
          [ -n "$REF" ] || REF="$TAG"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Sürüm: $TAG (kaynak: $REF)"

      - name: Skip if already built
        id: check
        run: |
          set -euo pipefail
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Zorla yeniden derleme"
            exit 0
          fi
          CURRENT=$(curl -fsSL "https://veilzon.github.io/animecix-flatpak/version.txt" 2>/dev/null || true)
          if [ "$CURRENT" = "${{ steps.tag.outputs.tag }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Bu sürüm zaten yayında: $CURRENT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout AnimeciX
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: veilzon/animecix-linux
          ref: ${{ steps.tag.outputs.ref }}
          path: src

      - name: Sürüm kontrolü (Cargo.toml == tag)
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          VER=$(grep -m1 '^version =' src/Cargo.toml | cut -d'"' -f2)
          EXPECTED="${{ steps.tag.outputs.tag }}"; EXPECTED="${EXPECTED#v}"
          echo "kaynak sürümü=$VER etiket=$EXPECTED"
          [ "$VER" = "$EXPECTED" ] || {
            echo "HATA: kaynak sürümü ($VER) etiketle ($EXPECTED) uyuşmuyor"
            exit 1
          }

      # Runtime cache'i sabit anahtarla tutulur; manifest/Cargo.lock
      # değişse bile GNOME runtime + SDK yeniden indirilmez.
      - name: Cache Flatpak runtime
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtime-${{ runner.os }}-gnome50-rust25.08-llvm25.08-v1

      - name: Cache Flatpak builder
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/flatpak-builder
          key: flatpak-builder-${{ runner.os }}-${{ hashFiles('src/packaging/flatpak/io.github.veilzon.AnimeciX.yml', 'src/Cargo.lock') }}
          restore-keys: |
            flatpak-builder-${{ runner.os }}-

      - name: Cache ccache
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('src/packaging/flatpak/io.github.veilzon.AnimeciX.yml') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install Flatpak runtime
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb ffmpeg ccache
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//50 org.gnome.Sdk//50
          flatpak install --user -y flathub org.freedesktop.Sdk.Extension.rust-stable//25.08
          flatpak install --user -y flathub org.freedesktop.Sdk.Extension.llvm20//25.08

      - name: Build and sign
        if: steps.check.outputs.skip != 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p public/repo
          ccache --max-size=2G || true
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          echo "KEYID=$KEYID" >> "$GITHUB_ENV"
          flatpak-builder --user --disable-rofiles-fuse --force-clean --ccache \
            --repo=public/repo --gpg-sign="$KEYID" --default-branch=stable \
            --install-deps-from=flathub \
            builddir src/packaging/flatpak/io.github.veilzon.AnimeciX.yml
          rm -f public/repo/refs/heads/master
          flatpak build-update-repo --gpg-sign="$KEYID" --prune \
            --generate-static-deltas --title="AnimeciX" \
            --default-branch=stable public/repo
          gpg --armor --export "$KEYID" | base64 -w0 > public/gpgkey.b64
          {
            echo "[Flatpak Ref]"
            echo "Title=AnimeciX"
            echo "Name=io.github.veilzon.AnimeciX"
            echo "Branch=stable"
            echo "Url=https://veilzon.github.io/animecix-flatpak/repo/"
            echo "SuggestRemoteName=animecix"
            echo "RuntimeRepo=https://flathub.org/repo/flathub.flatpakrepo"
            echo "GPGKey=$(cat public/gpgkey.b64)"
            echo "IsRuntime=false"
          } > public/animecix.flatpakref
          echo "${{ steps.tag.outputs.tag }}" > public/version.txt
          touch public/.nojekyll
          cat > public/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>AnimeciX Flatpak</title>
          <h1>AnimeciX Flatpak</h1>
          <p><a href="animecix.flatpakref">animecix.flatpakref</a></p>
          <pre>flatpak install --from https://veilzon.github.io/animecix-flatpak/animecix.flatpakref</pre>
          HTML

      - name: Smoke test
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          flatpak --user remote-delete --force animecix-test 2>/dev/null || true
          # Cache'ten gelen eski kurulumları kaldır. Aynı uygulamanın stable ve
          # master dalları kurulu olabildiği için tek tek kaldırıyoruz; yoksa
          # install "zaten kurulu" deyip yeni build'i test etmeden atlar.
          flatpak --user list --app --columns=ref \
            | grep '^app/io.github.veilzon.AnimeciX/' \
            | while read -r ref; do flatpak --user uninstall -y "$ref" || true; done || true
          flatpak --user remote-add --no-gpg-verify animecix-test public/repo
          flatpak --user install -y --reinstall animecix-test io.github.veilzon.AnimeciX
          EXPECTED="${{ steps.tag.outputs.tag }}"; EXPECTED="${EXPECTED#v}"
          VER=$(flatpak --user info io.github.veilzon.AnimeciX//stable | awk '/Version:/ {print $2; exit}')
          echo "Kurulan sürüm: $VER (beklenen: $EXPECTED)"
          [ "$VER" = "$EXPECTED" ] || { echo "HATA: yeni build kurulmadı"; exit 1; }
          flatpak --user info io.github.veilzon.AnimeciX//stable | sed -n '1,12p'
          xvfb-run -a flatpak run --command=animecix io.github.veilzon.AnimeciX --check-icons
          xvfb-run -a flatpak run --command=animecix io.github.veilzon.AnimeciX --check-shaders
          flatpak run --command=mpv io.github.veilzon.AnimeciX --version
          # LuaJIT/OSC kontrolü: OSC olmadan oynatma kontrolleri görünmez.
          flatpak run --command=mpv io.github.veilzon.AnimeciX --list-options | grep -q -- '--osc' || { echo 'OSC/Lua yok'; exit 1; }
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc=size=320x240:rate=30 -t 1 -pix_fmt yuv420p "$HOME/mpv-smoke.mp4"
          flatpak run --command=mpv io.github.veilzon.AnimeciX --no-config --vo=null --ao=null --really-quiet "$HOME/mpv-smoke.mp4"
          # HTTPS/FFmpeg TLS kontrolü
          timeout 40 flatpak run --command=mpv io.github.veilzon.AnimeciX --no-config --vo=null --ao=null --really-quiet https://www.w3schools.com/html/mov_bbb.mp4
          flatpak --user info io.github.veilzon.AnimeciX//stable | sed -n '1,12p'

      - name: mpv çökme tanılama
        if: failure()
        run: |
          set +e
          echo '--- LD_DEBUG=libs ---'
          flatpak run --command=sh io.github.veilzon.AnimeciX -c 'LD_DEBUG=libs /app/bin/mpv --version' 2>&1 | tail -n 120
          echo '--- MALLOC_CHECK ---'
          flatpak run --command=sh io.github.veilzon.AnimeciX -c 'MALLOC_CHECK_=3 /app/bin/mpv --version' 2>&1 | tail -n 60
          echo '--- gdb (SDK) ---'
          flatpak-builder --run builddir src/packaging/flatpak/io.github.veilzon.AnimeciX.yml \
            gdb -batch -ex run -ex 'thread apply all bt' --args /app/bin/mpv --version 2>&1 | tail -n 140
          echo '--- ldd ---'
          flatpak run --command=sh io.github.veilzon.AnimeciX -c 'ldd /app/bin/mpv' 2>&1 | tail -n 80

      - name: Setup Pages
        if: steps.check.outputs.skip != 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
